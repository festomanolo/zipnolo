[package]
name = "zipnolo"
version = "0.2.1"
edition = "2021"
authors = ["festomanolo <https://festomanolo.com>"]
description = "High-ratio lossless block-parallel file and folder archiver for Linux, macOS, and Windows — by festomanolo (https://festomanolo.com)"
homepage = "https://festomanolo.com"
repository = "https://github.com/festomanolo/zipnolo"
license = "MIT"
readme = "README.md"
keywords = ["compression", "archiver", "parallel", "brotli", "cli"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "zipnolo"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
crossbeam-channel = "0.5"
lz4_flex = "0.11"
snap = "1.1"
brotli = "7.0"
flate2 = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
anyhow = "1.0"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
