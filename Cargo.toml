[package]
name = "zipnolo"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "zipnolo"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
crossbeam-channel = "0.5"
lz4_flex = "0.11"
snap = "1.1"
brotli = "7.0"
flate2 = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
anyhow = "1.0"
crossterm = "0.28"
