[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "zipnolo"
version = "0.2.1"
description = "High-ratio lossless block-parallel file and folder archiver for Linux, macOS, and Windows — Created by festomanolo (https://festomanolo.com)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "festomanolo", email = "festomanolo@users.noreply.github.com" }
]
keywords = ["compression", "archiver", "brotli", "lz4", "parallel", "cli", "zipnolo", "festomanolo"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://festomanolo.com"
Author = "https://festomanolo.com"
Repository = "https://github.com/festomanolo/zipnolo"
Issues = "https://github.com/festomanolo/zipnolo/issues"

[tool.maturin]
bindings = "bin"
strip = true
